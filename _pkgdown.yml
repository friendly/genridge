url: https://friendly.github.io/genridge

template:
  bootstrap: 5
  math-rendering: katex
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

reference:
- title: "Ridge functions"
  desc: >
    Functions for computing ridge regressions
  contents: 
    - genridge-package
    - precision
    - ridge
    - coef.ridge
    - print.ridge
    - vcov.ridge
    - vif.ridge
    - best.ridge

- title: "Plot methods"
  desc: "Plotting ridge regression results"
  contents:
    - contourf
    - plot.ridge
    - plot.precision
    - plot3d
    - plot3d.ridge
    - pairs.ridge
    - traceplot
    - trans.colors

- title: "PCA methods"
  desc: "Low-rank PCA methods"
  contents:
    - pca
    - pca.ridge
    - biplot.pcaridge

- title: "Multivariate ridge regression (experimental)"
  desc: >
    Ridge regression for several responses with common ridge constants:
    `ridge()` with a matrix response returns an `"mlmridge"` object.
  contents:
    - as.ridge
    - mlmridge-methods
    - mlmridge-plots

- title: "Data sets"
  desc: "Data sets in the package"
  contents:
    - Acetylene
    - Detroit
    - Manpower
    - prostate
    - diab



